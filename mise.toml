[tools]
bun = "1.4.2"
dotnet = "10.0.400"

[tasks.frontend-dev]
dir = "frontend"
run = "bun dev --open"

[tasks.backend-dev]
dir = "backend"
run = "dotnet watch"

[tasks.dev]
run = "mise run -j 2 backend-dev ::: frontend-dev"

# Formatting

[tasks.frontend-fmt]
dir = "frontend"
run = "bun run fmt"

[tasks.backend-fmt]
run = "dotnet csharpier format backend"

[tasks.fmt]
run = "mise run -j 2 backend-fmt ::: frontend-fmt"
